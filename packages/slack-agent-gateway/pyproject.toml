[project]
name = "slack-agent-gateway"
version = "0.1.0"
description = "Connect authorized Slack requests to Codex or Claude Code"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.18,<2",
]

[project.scripts]
slack-agent-gateway = "slack_agent_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_agent_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
