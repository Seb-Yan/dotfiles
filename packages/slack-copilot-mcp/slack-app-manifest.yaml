display_information:
  name: Personal Slack Copilot
  description: Lets a local Codex session read Slack and reply after approval
  background_color: "#4a154b"
oauth_config:
  scopes:
    user:
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - mpim:history
      - mpim:read
      - search:read
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
